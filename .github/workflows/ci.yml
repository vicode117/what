name: CI

on:
  push:
    branches: [master, main]
    tags: ['*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  build:
    name: bundle (main / preload / renderer)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: translate-trainer-${{ github.sha }}
          path: apps/desktop/out/
          retention-days: 7

  # Windows installer + GitHub release on tagged commits. Requires no
  # extra setup on github-hosted runners; counts Windows minutes.
  package-windows:
    name: windows installer + release
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Use tag as app version
        shell: bash
        working-directory: apps/desktop
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const f='package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version='$VERSION';fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "app version set to $VERSION"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build installer
        shell: bash
        run: |
          set -o pipefail
          pnpm dist:installer 2>&1 | tee build.log
      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          tail -10 build.log 2>/dev/null | while IFS= read -r line; do
            echo "::error::$line"
          done
          {
            echo '### Windows installer build failed — log tail'
            echo ''
            echo '```'
            tail -60 build.log 2>/dev/null || echo '(build.log missing)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: translate-trainer-setup-${{ github.ref_name }}
          path: apps/desktop/release/*.exe
          retention-days: 14
          if-no-files-found: error
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.exe
          generate_release_notes: true
