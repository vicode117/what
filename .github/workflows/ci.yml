name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  tags: ['*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  build:
    name: bundle (main / preload / renderer)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: translate-trainer-${{ github.sha }}
          path: apps/desktop/out/
          retention-days: 7

  # Windows installer on tagged releases. Requires no extra setup on
  # github-hosted runners; counts Windows minutes.
  package-windows:
    name: windows installer
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build installer
        run: pnpm dist:installer
      - uses: actions/upload-artifact@v4
        with:
          name: translate-trainer-setup-${{ github.ref_name }}
          path: apps/desktop/release/*.exe
          retention-days: 14
          if-no-files-found: error
